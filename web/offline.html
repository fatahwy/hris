<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2b5fe1">
    <title>PRANATA HR - Offline</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fbfcff;
            color: #334155;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .offline-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 28px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }
        .icon-wrapper {
            width: 88px;
            height: 88px;
            margin: 0 auto 24px;
            border-radius: 22px;
            background: linear-gradient(135deg, #2b5fe1, #1a42a7);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(43, 95, 225, 0.3);
        }
        .icon-wrapper img {
            width: 56px;
            height: 56px;
            object-fit: contain;
        }
        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 10px;
        }
        p {
            font-size: 0.95rem;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn-reload {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: #2b5fe1;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 13px 20px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(43, 95, 225, 0.25);
        }
        .btn-reload:hover {
            background: #224ec0;
            transform: translateY(-1px);
        }
        .status-badge {
            display: inline-block;
            margin-top: 18px;
            font-size: 0.78rem;
            color: #94a3b8;
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon-wrapper">
            <img src="images/icons/icon-192x192.png" alt="PRANATA HR Logo">
        </div>
        <h1>Anda Sedang Offline</h1>
        <p>Koneksi internet terputus. Pastikan perangkat Anda terhubung ke Wi-Fi atau data seluler untuk mengakses PRANATA HR.</p>
        <button class="btn-reload" onclick="window.location.reload();">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            Muat Ulang Halaman
        </button>
        <div>
            <span class="status-badge">PRANATA HR PWA Mode</span>
        </div>
    </div>
</body>
</html>
